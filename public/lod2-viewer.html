<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dakmodel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(180deg, #87CEEB 0%, #B0D7E8 50%, #E5E5E5 100%); overflow: hidden; }
    #help {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: white; padding: 5px 10px;
      border-radius: 20px; font-size: 11px; font-family: -apple-system, sans-serif;
      white-space: nowrap; pointer-events: none; backdrop-filter: blur(6px);
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.65); color: white; padding: 14px 20px;
      border-radius: 10px; font-size: 13px; font-family: -apple-system, sans-serif;
      z-index: 100; text-align: center; backdrop-filter: blur(8px);
    }
    #loading .spin {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- proj4 voor WGS84 → Lambert72 conversie (luchtfoto bbox) -->
  <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
</head>
<body>
  <div id="help">🖱 Sleep: roteren · Scroll: zoom</div>
  <div id="loading"><span class="spin"></span>3D-model laden…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const params = new URLSearchParams(window.location.search);
    const glbUrl = params.get('glb');
    const lat    = parseFloat(params.get('lat') || '0');
    const lng    = parseFloat(params.get('lng') || '0');

    if (!glbUrl) {
      document.getElementById('loading').textContent = '❌ Geen GLB-url opgegeven';
      throw new Error('no glb param');
    }

    // ─── Lambert72 definitie voor luchtfoto ────────────────────
    proj4.defs('EPSG:31370',
      '+proj=lcc +lat_1=51.16666723333333 +lat_2=49.8333339 +lat_0=90 ' +
      '+lon_0=4.367486666666666 +x_0=150000.013 +y_0=5400088.438 ' +
      '+ellps=intl +towgs84=-106.869,52.2978,-103.724,0.3366,-0.457,1.8422,-1.2747 ' +
      '+units=m +no_defs');

    // ─── Scene ─────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xCDE4F2);
    scene.fog = new THREE.Fog(0xCDE4F2, 80, 250);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(35, 25, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    // ─── Belichting ───────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xc8d8ec, 0.65));
    const sun = new THREE.DirectionalLight(0xffeacc, 2.4);
    sun.position.set(35, 60, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
    sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
    sun.shadow.bias = -0.0008;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xa8c8ff, 0x6b5a3e, 0.5));

    // ─── Controls ─────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 120;
    controls.maxPolarAngle = Math.PI * 0.49;

    // ─── Procedurele texturen ─────────────────────────────────
    function makeDakpannenTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3a1f15';
      ctx.fillRect(0, 0, size, size);
      const cols = 16, rows = 24;
      const cw = size / cols, ch = size / rows;
      for (let r = 0; r < rows; r++) {
        const ys = (r % 2) * (cw / 2);
        for (let c = -1; c < cols + 1; c++) {
          const x = c * cw + ys, y = r * ch;
          const t = Math.floor(Math.random() * 35);
          const grad = ctx.createLinearGradient(x, y, x, y + ch);
          grad.addColorStop(0, `rgb(${130+t},${50+Math.floor(t*.4)},${35+Math.floor(t*.3)})`);
          grad.addColorStop(0.7, `rgb(${60+Math.floor(t*.5)},${30+Math.floor(t*.24)},${21+Math.floor(t*.18)})`);
          grad.addColorStop(1, `rgb(${30},${15},${10})`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(x, y + ch);
          ctx.lineTo(x, y + ch * 0.3);
          ctx.quadraticCurveTo(x + cw/2, y - ch * 0.05, x + cw, y + ch * 0.3);
          ctx.lineTo(x + cw, y + ch);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(x, y + ch * 0.92, cw, ch * 0.08);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeBaksteenTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5a3a2a';
      ctx.fillRect(0, 0, size, size);
      const cols = 8, rows = 24, bw = size/cols, bh = size/rows;
      for (let r = 0; r < rows; r++) {
        const off = (r % 2) * bw / 2;
        for (let c = -1; c < cols + 1; c++) {
          const t = Math.floor(Math.random() * 40);
          ctx.fillStyle = `rgb(${190+t},${165+Math.floor(t*.7)},${140+Math.floor(t*.5)})`;
          ctx.fillRect(c * bw + off + 1, r * bh + 1, bw - 2, bh - 2);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const dakTexture  = makeDakpannenTexture();
    const muurTexture = makeBaksteenTexture();

    const muurMat = new THREE.MeshStandardMaterial({
      map: muurTexture, color: 0xfff0e0, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide,
    });
    const dakMat = new THREE.MeshStandardMaterial({
      map: dakTexture, color: 0xffffff, roughness: 0.65, metalness: 0.05, side: THREE.DoubleSide,
    });

    // ─── Luchtfoto ground plane ───────────────────────────────
    if (lat && lng) {
      const [xl72, yl72] = proj4('EPSG:4326', 'EPSG:31370', [lng, lat]);
      const r = 40;
      const luchtfotoUrl =
        'https://geo.api.vlaanderen.be/OMWRGBMRVL/wms' +
        '?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image/jpeg' +
        '&LAYERS=Ortho&STYLES=&CRS=EPSG:31370' +
        `&BBOX=${xl72-r},${yl72-r},${xl72+r},${yl72+r}&WIDTH=1024&HEIGHT=1024`;
      const tex = new THREE.TextureLoader().load(luchtfotoUrl, () => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      });
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(r * 2, r * 2),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 1.0, metalness: 0.0 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.05;
      ground.receiveShadow = true;
      scene.add(ground);
    }

    // ─── Laad GLB ─────────────────────────────────────────────
    new GLTFLoader().load(glbUrl, (gltf) => {
      const model = gltf.scene;
      model.traverse((node) => {
        if (!node.isMesh) return;
        const geom = node.geometry;
        geom.computeVertexNormals();

        const bb = new THREE.Box3().setFromBufferAttribute(geom.attributes.position);
        const sz = bb.getSize(new THREE.Vector3());
        dakTexture.repeat.set(Math.max(2, sz.x / 1.5), Math.max(2, sz.x / 1.5));
        muurTexture.repeat.set(Math.max(2, Math.max(sz.x, sz.z) / 2), Math.max(2, Math.max(sz.x, sz.z) / 2) * 0.5);

        const pos = geom.attributes.position;
        const oldIdx = geom.index ? geom.index.array : null;
        const wallFaces = [], roofFaces = [];
        const faceCount = oldIdx ? oldIdx.length / 3 : pos.count / 3;
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();

        for (let f = 0; f < faceCount; f++) {
          const i0 = oldIdx ? oldIdx[f*3]   : f*3;
          const i1 = oldIdx ? oldIdx[f*3+1] : f*3+1;
          const i2 = oldIdx ? oldIdx[f*3+2] : f*3+2;
          a.fromBufferAttribute(pos, i0);
          b.fromBufferAttribute(pos, i1);
          c.fromBufferAttribute(pos, i2);
          n.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a)).normalize();
          (n.y > 0.35 ? roofFaces : wallFaces).push(i0, i1, i2);
        }

        const newIdx = new Uint32Array(wallFaces.length + roofFaces.length);
        newIdx.set(wallFaces, 0);
        newIdx.set(roofFaces, wallFaces.length);
        geom.setIndex(new THREE.BufferAttribute(newIdx, 1));

        const uvs = new Float32Array(pos.count * 2);
        for (let i = 0; i < pos.count; i++) {
          uvs[i*2]   = (pos.getX(i) + pos.getZ(i)) * 0.5;
          uvs[i*2+1] = pos.getY(i);
        }
        geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        geom.clearGroups();
        geom.addGroup(0, wallFaces.length, 0);
        geom.addGroup(wallFaces.length, roofFaces.length, 1);
        geom.computeVertexNormals();

        node.material = [muurMat, dakMat];
        node.castShadow = true;
        node.receiveShadow = true;
      });

      scene.add(model);
      const bbox = new THREE.Box3().setFromObject(model);
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      controls.target.set(center.x, size.y * 0.5, center.z);
      camera.position.set(center.x + size.x * 1.8, size.y * 1.6, center.z + size.z * 1.8);
      controls.update();
      document.getElementById('loading').style.display = 'none';
    }, undefined, (err) => {
      document.getElementById('loading').textContent = '❌ Model kon niet worden geladen';
      console.error(err);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
